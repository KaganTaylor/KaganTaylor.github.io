<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Strict house-rules — running…</title>
<style>
  body { font-family: ui-monospace, Consolas, monospace; margin: 2rem; background: #14171c; color: #d8dee6; }
  .pass { color: #6fce7f; }
  .fail { color: #ff7676; }
  h1 { font-size: 1.2rem; }
  h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; color: #aab3c0; }
  pre { white-space: pre-wrap; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 2px 0; }
  li .id::before { display: inline-block; width: 1.4em; }
  li.pass .id::before { content: "✓"; color: #6fce7f; }
  li.fail .id::before { content: "✕"; color: #ff7676; }
  li.fail .notes { color: #ff9e9e; margin-left: 1.4em; }
</style>
</head>
<body>
<h1 id="headline">Running…</h1>
<div id="lists"></div>
<script type="module">
import { runStrictTests } from './strict-support.js';
import { runStrictConvoyTests } from './strict-convoy.js';
const headline = document.getElementById('headline');
const lists = document.getElementById('lists');

function renderList(title, result) {
  const failuresById = new Map(result.failures.map((f) => [f.id, f.notes]));
  const h2 = document.createElement('h2');
  h2.textContent = `${title} — ${result.pass}/${result.total} passed`;
  const ul = document.createElement('ul');
  for (const t of result.all) {
    const li = document.createElement('li');
    li.className = t.pass ? 'pass' : 'fail';
    const id = document.createElement('span');
    id.className = 'id';
    id.textContent = t.id;
    li.appendChild(id);
    const notes = failuresById.get(t.id);
    if (notes) {
      const n = document.createElement('div');
      n.className = 'notes';
      n.textContent = notes.join('\n');
      li.appendChild(n);
    }
    ul.appendChild(li);
  }
  lists.append(h2, ul);
}

try {
  const s = runStrictTests();
  const c = runStrictConvoyTests();
  const pass = s.pass + c.pass;
  const total = s.total + c.total;
  headline.textContent =
    `Strict house-rules: ${pass}/${total} passed ` +
    `(support ${s.pass}/${s.total}, convoy ${c.pass}/${c.total})`;
  headline.className = pass === total ? 'pass' : 'fail';
  renderList('Support house-rule', s);
  renderList('Convoy house-rule', c);
  document.title = `Strict ${pass}/${total}`;
} catch (e) {
  headline.textContent = 'RUNNER ERROR';
  headline.className = 'fail';
  const pre = document.createElement('pre');
  pre.textContent = e.stack || String(e);
  lists.appendChild(pre);
}
document.body.dataset.done = '1';
</script>
</body>
</html>
